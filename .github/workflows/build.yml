name: Build Coffee Glass mod
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CoffeMinecraft-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
