plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.kvolmik.coffeeminecraft'
version = '1.0.8'
base { archivesName = 'CoffeMinecraft-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { coffeeminecraft { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

def coffeeMugModelGzip = file('src/model-source/coffee_mug.json.gz')
def generatedCoffeeMugModel = layout.buildDirectory.file('generated/coffee-mug-resources/assets/coffeeminecraft/models/item/coffee_mug.json')
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/coffee-mug-resources'))

tasks.register('restoreCoffeeMugModel') {
    inputs.file(coffeeMugModelGzip)
    outputs.file(generatedCoffeeMugModel)
    doLast {
        def destination = generatedCoffeeMugModel.get().asFile
        destination.parentFile.mkdirs()
        new java.util.zip.GZIPInputStream(new java.io.FileInputStream(coffeeMugModelGzip)).withCloseable { input ->
            destination.withOutputStream { output -> input.transferTo(output) }
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('restoreCoffeeMugModel')
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': 'coffeeminecraft',
        'Specification-Vendor': 'kvolmik-bit',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}
