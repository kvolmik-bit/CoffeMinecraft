plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.kvolmik.coffeeminecraft'
version = '1.0.8'
base { archivesName = 'CoffeMinecraft-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { coffeeminecraft { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

def coffeeMugArchive = file('src/model-source/coffee_mug_square_forge_1.20.1.zip')
def generatedCoffeeMugResources = layout.buildDirectory.dir('generated/coffee-mug-resources')
sourceSets.main.resources.srcDir(generatedCoffeeMugResources)

tasks.register('extractCoffeeMugAssets', Copy) {
    from(zipTree(coffeeMugArchive))
    include 'assets/**'
    into generatedCoffeeMugResources
}

tasks.named('processResources').configure {
    dependsOn tasks.named('extractCoffeeMugAssets')
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': 'coffeeminecraft',
        'Specification-Vendor': 'kvolmik-bit',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}
